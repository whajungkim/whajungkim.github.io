<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
:root{

  --accent:#e8b400; --accent-ink:#1d1a16; --card:#ffffff; --red:#e0453a;

}

  :root{ color-scheme:dark; --bg:#17150f; --ink:#f3ede2; --muted:#a79f92; --line:#33302a; --card:#221f19; }
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;padding-inline:16px;padding-block:12px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;box-sizing:border-box}
.brandline{margin:0;font-size:14px;color:var(--muted);letter-spacing:.08em}.brandline a{color:inherit;text-decoration:none;font-weight:700}
h1{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400;font-size:clamp(30px,8vw,44px);margin:4px 0 0;letter-spacing:.5px;color:var(--ink);text-wrap:balance}
.cats{display:flex;flex-direction:column;gap:6px;align-items:center}.cats .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}.cats .lab{font-size:12px;color:var(--muted);letter-spacing:.08em;margin-right:2px}
.cats button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:15px;font-family:inherit;font-weight:700;cursor:pointer}
.cats button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cats button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stage{position:relative;width:min(88vw,380px);aspect-ratio:1;max-width:100%}
canvas{width:100%;height:100%;display:block;border-radius:50%;box-shadow:0 10px 30px rgba(0,0,0,.18);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.pin{position:absolute;left:50%;top:-4px;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:34px solid var(--ink);filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.hint{font-size:18px;font-weight:700;text-align:center;margin:0;min-height:1.4em}
.hint em{font-style:normal;color:var(--accent);background:var(--ink);padding:0 6px;border-radius:4px}
.result{display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 20px;width:min(88vw,380px);box-sizing:border-box;text-align:center}
.result .menu{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-size:clamp(34px,10vw,52px);line-height:1.1;color:var(--ink)}
.result .who{font-size:14px;color:var(--muted)}
.recipe{width:100%;text-align:left;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.recipe .time{font-weight:700;color:var(--red);font-size:15px}
.recipe h3{margin:0;font-size:15px;color:var(--muted);letter-spacing:.06em}
.recipe ul,.recipe ol{margin:0;padding-left:20px;font-size:16px;line-height:1.55}
.recipe li{margin:2px 0}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.actions button,.actions a{font-family:inherit;font-weight:700;font-size:16px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;cursor:pointer}
.actions .again{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.foot{font-size:13px;color:var(--muted);text-align:center;margin:0}
.yt{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.yt a{font-weight:700;font-size:15px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none}.yt a.sub{background:#e0453a;color:#fff;border-color:#e0453a}
</style>

<h1>오늘 뭐 해 먹지?</h1>

<p class="foot">안 멈추시면 6초 뒤 회전판이 스스로 멈춥니다. 그 결과도 진짜 무작위입니다. 재료는 2인분 기준. 냉장고에 있는 것으로 좁히려면 재료별 탭.</p>

<script>
const R={
 "김치찌개":{t:"25분",i:["신김치 1/4포기","돼지고기 200g","두부 1/2모","대파·양파","고춧가루·다진마늘 1큰술씩"],s:["냄비에 기름 두르고 고기·김치를 3분 볶는다.","물 3컵과 고춧가루·마늘을 넣고 15분 끓인다.","두부·대파를 넣고 3분 더. 간은 국간장으로."]},
 "된장찌개":{t:"20분",i:["된장 2큰술","두부 1/2모","애호박·양파·감자 조금씩","청양고추 1개","멸치육수 3컵"],s:["육수에 된장을 풀고 감자·양파를 먼저 넣어 끓인다.","애호박·두부·고추를 넣고 7분 끓인다.","다진마늘 반 큰술로 마무리."]},
 "순두부찌개":{t:"15분",i:["순두부 1봉","돼지고기 또는 바지락 100g","고춧가루 1.5큰술","달걀 1개","대파·마늘"],s:["기름에 고춧가루·마늘·고기를 약불로 볶아 고추기름을 낸다.","물 2컵을 붓고 끓으면 순두부를 숟가락으로 떠 넣는다.","5분 뒤 달걀·대파를 넣고 불을 끈다."]},
 "미역국":{t:"30분",i:["마른미역 한 줌(20g)","소고기 국거리 150g","국간장 2큰술","참기름·마늘"],s:["미역을 15분 불려 자른다.","참기름에 고기·미역을 3분 볶고 국간장으로 간한다.","물 5컵을 붓고 20분 끓인다."]},
 "콩나물국":{t:"15분",i:["콩나물 200g","멸치육수 4컵","대파·마늘","소금·새우젓"],s:["육수에 콩나물을 넣고 뚜껑 닫아 5분 끓인다(중간에 열지 않는다).","마늘·대파를 넣고 새우젓과 소금으로 간한다."]},
 "계란국":{t:"10분",i:["달걀 2개","멸치육수 3컵","대파","국간장·소금"],s:["육수를 끓이고 국간장 1큰술로 간한다.","달걀을 풀어 원을 그리며 붓고 젓지 않는다.","대파를 넣고 30초 뒤 불을 끈다."]},
 "소고기무국":{t:"30분",i:["소고기 국거리 150g","무 1/4개","국간장 2큰술","마늘·대파·참기름"],s:["참기름에 고기와 나박 썬 무를 3분 볶는다.","물 5컵을 붓고 20분 끓인다.","국간장·마늘·대파로 마무리."]},

 "북엇국":{t:"20분",i:["북어채 한 줌","달걀 1개","두부 1/4모","참기름·국간장·마늘·대파"],s:["북어채를 물에 헹궈 참기름에 2분 볶는다.","물 4컵을 붓고 10분 끓여 국간장으로 간한다.","두부·달걀·대파를 넣고 2분."]},
 "어묵국":{t:"15분",i:["어묵 3장","무 조금","멸치육수 4컵","국간장·대파·청양고추"],s:["육수에 무를 넣고 5분 끓인다.","어묵을 넣고 5분, 국간장으로 간.","대파·고추로 마무리."]},
 "떡국":{t:"20분",i:["떡국떡 300g","소고기 국거리 100g","달걀 1개","국간장·마늘·대파·김가루"],s:["참기름에 고기를 볶고 물 4컵을 부어 10분 끓인다.","떡을 넣고 떠오르면 국간장으로 간.","달걀을 풀어 넣고 대파·김가루."]},
 "청국장":{t:"20분",i:["청국장 1/2컵","두부 1/2모","김치 1/2컵","양파·대파·고춧가루"],s:["멸치육수 2.5컵에 김치·양파를 넣고 5분 끓인다.","청국장을 풀고 두부를 넣어 7분 끓인다.","대파·고춧가루로 마무리. 오래 끓이지 않는다."]},
 "제육볶음":{t:"20분",i:["돼지 앞다리살 300g","양파 1/2개·대파","고추장 2큰술·고춧가루 1큰술","간장 1큰술·설탕 1큰술·마늘 1큰술"],s:["양념에 고기를 10분 재운다.","센 불에 고기를 볶다 양파를 넣는다.","대파를 넣고 1분, 참기름 한 방울."]},
 "계란말이":{t:"10분",i:["달걀 4개","당근·대파 다진 것 3큰술","소금 약간","우유 2큰술"],s:["달걀을 풀어 재료를 섞는다.","약불 팬에 얇게 붓고 반쯤 익으면 만다.","남은 달걀물을 부어 가며 두 번 더 만다."]},
 "두부조림":{t:"15분",i:["두부 1모","간장 3큰술·고춧가루 1큰술","설탕 1작은술·마늘·대파","물 1/2컵"],s:["두부를 1cm로 썰어 기름에 노릇하게 굽는다.","양념과 물을 부어 약불로 7분 조린다.","대파를 얹고 국물을 끼얹는다."]},
 "고등어구이":{t:"15분",i:["고등어 1마리(손질)","소금","레몬 또는 무 간 것"],s:["고등어에 소금을 뿌려 10분 둔다.","기름 두른 팬에 껍질부터 중불 5분, 뒤집어 4분.","무 간 것과 간장을 곁들인다."]},
 "오징어볶음":{t:"20분",i:["오징어 1마리","양파·양배추·대파","고추장 1.5큰술·고춧가루 1큰술","간장·설탕·마늘 1큰술씩"],s:["오징어를 손질해 한입 크기로 자른다.","채소를 센 불에 2분 볶고 오징어·양념을 넣는다.","3분만 볶는다. 오래 볶으면 질겨진다."]},
 "감자조림":{t:"20분",i:["감자 3개","간장 3큰술·설탕 1큰술","물 1컵","참기름·깨"],s:["감자를 깍둑 썰어 기름에 3분 볶는다.","간장·설탕·물을 붓고 뚜껑 닫아 10분.","국물이 졸면 참기름·깨."]},
 "멸치볶음":{t:"10분",i:["잔멸치 1컵","간장 1큰술·설탕 1작은술","올리고당 1큰술","마늘·깨"],s:["마른 팬에 멸치를 1분 볶아 비린내를 뺀다.","기름·마늘을 넣고 간장·설탕을 넣어 볶는다.","불 끄고 올리고당·깨."]},
 "소시지야채볶음":{t:"10분",i:["소시지 200g","양파·피망·당근","케첩 2큰술·간장 1/2큰술","설탕 1작은술"],s:["소시지에 칼집을 내고 데친다.","채소를 볶다 소시지를 넣는다.","양념을 넣고 2분 볶는다."]},
 "닭볶음탕":{t:"35분",i:["닭 볶음용 600g","감자 2개·양파·당근","고추장 2큰술·고춧가루 2큰술","간장 3큰술·설탕 1큰술·마늘"],s:["닭을 끓는 물에 2분 데쳐 헹군다.","양념·물 2컵과 함께 15분 끓인다.","감자·당근을 넣고 15분 더 조린다."]},
 "불고기":{t:"20분",i:["불고기용 소고기 300g","양파·대파·버섯","간장 3큰술·설탕 1.5큰술","배즙 또는 물 3큰술·마늘·참기름"],s:["양념에 고기를 15분 재운다.","팬에 고기와 채소를 넣고 중불로 볶는다.","국물이 자작할 때 불을 끈다."]},
 "애호박전":{t:"15분",i:["애호박 1개","부침가루 1/2컵·달걀 1개","소금"],s:["애호박을 0.5cm로 썰어 소금을 살짝 뿌린다.","부침가루 → 달걀물 순서로 묻힌다.","중불에 앞뒤로 노릇하게 굽는다."]},
 "김치전":{t:"15분",i:["신김치 1컵","부침가루 1컵·물 3/4컵","김칫국물 2큰술"],s:["김치를 잘게 썰어 반죽에 섞는다.","기름을 넉넉히 두르고 얇게 편다.","가장자리가 바삭해지면 뒤집는다."]},
 "김치볶음밥":{t:"10분",i:["밥 2공기","김치 1컵","햄 또는 참치","달걀 2개·참기름·김가루"],s:["기름에 김치·햄을 2분 볶는다.","밥을 넣고 고루 볶다 간장 1/2큰술.","달걀프라이를 얹고 김가루·참기름."]},

 "두부":["두부조림","된장찌개","순두부찌개","마파두부","청국장","두부김치","두부부침","두부동그랑땡","미소된장국","김치찌개","부대찌개","니쿠자가"],

 "스팸":["부대찌개","김치볶음밥","스팸계란덮밥","스팸감자볶음","소시지야채볶음","스팸무스비","햄치즈토스트","볶음우동","스팸마요덮밥","계란볶음밥","김치찜","오므라이스"]
};
const MIX=["김치찌개","마파두부","규동","토마토파스타","제육볶음","짜장밥","오야코동","오믈렛","된장찌개","계란볶음밥","오므라이스","함박스테이크","계란말이","깐풍기","카레라이스","크림파스타","김치볶음밥","비빔밥","순두부찌개","두부조림","불고기","미역국","고등어구이","잔치국수","떡볶이"];
const COLORS=["--w1","--w2","--w3","--w4","--w5","--w6","--w7","--w8","--w9","--w10","--w11","--w12"];
const cv=document.getElementById('wheel'),ctx=cv.getContext('2d');
const hint=document.getElementById('hint'),result=document.getElementById('result'),menuEl=document.getElementById('menu'),whoEl=document.getElementById('who'),recEl=document.getElementById('recipe');
let labels=MIX.slice(),angle=0,vel=0,state='idle',autoTimer=null,raf=null,target=null;
let N=labels.length,SEG=Math.PI*2/N;
function setLabels(a){labels=a.slice();N=labels.length;SEG=Math.PI*2/N;}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function draw(){
  const Rr=cv.width/2,cx=Rr,cy=Rr; ctx.clearRect(0,0,cv.width,cv.height);
  for(let i=0;i<N;i++){
    const a0=angle+i*SEG-Math.PI/2-SEG/2,a1=a0+SEG;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,Rr-6,a0,a1);ctx.closePath();
    ctx.fillStyle=css(COLORS[i%((N%12===1)?11:12)]);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=2;ctx.stroke();
    ctx.save();ctx.translate(cx,cy);ctx.rotate(a0+SEG/2);ctx.textAlign='right';ctx.textBaseline='middle';
    ctx.fillStyle='#fff';ctx.font='bold '+(N>16?24:32)+'px "Noto Sans KR",sans-serif';ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=4;
    ctx.fillText(labels[i],Rr-28,0);ctx.restore();
  }
  ctx.beginPath();ctx.arc(cx,cy,34,0,Math.PI*2);ctx.fillStyle=css('--ink');ctx.fill();
}
function indexAtPin(){ let a=(-angle)%(Math.PI*2); if(a<0)a+=Math.PI*2; return Math.round(a/SEG)%N; }
function rnd(n){const u=new Uint32Array(1);crypto.getRandomValues(u);return u[0]%n}
let lastTs=0; const K=1.6, STOP_SEC=3.2; let t0=0,a0=0,v0=0,goal=0;
function loop(ts){
  const dt=lastTs?Math.min(0.1,(ts-lastTs)/1000):0.016; lastTs=ts;
  if(state==='spinning'){angle+=vel*dt;}
  else if(state==='stopping'){
    const t=(ts-t0)/1000; angle=a0+(v0/K)*(1-Math.exp(-K*t));
    if(t>=STOP_SEC){angle=goal;state='done';finish(indexAtPin(),target);return draw();}
  }
  draw(); raf=requestAnimationFrame(loop);
}
function start(){
  if(state==='spinning')return stop('나');
  clearTimeout(autoTimer); result.hidden=true; state='spinning'; vel=19+rnd(100)/16; target=null; lastTs=0;
  hint.innerHTML='한 번 더 <em>탭</em>하면 멈춥니다';
  autoTimer=setTimeout(()=>{ if(state==='spinning') stop('회전판'); },6000);
  cancelAnimationFrame(raf); raf=requestAnimationFrame(loop);
}
function stop(by){
  if(state!=='spinning')return; clearTimeout(autoTimer); target=by;
  t0=performance.now(); a0=angle;
  let k; if(by==='회전판'){ k=rnd(N); }
  else { const fin=a0+vel/K; let a=(-fin)%(Math.PI*2); if(a<0)a+=Math.PI*2; k=Math.round(a/SEG)%N; }
  goal=-k*SEG; while(goal<a0+Math.PI*2) goal+=Math.PI*2;
  v0=(goal-a0)*K; state='stopping'; hint.textContent='…';
}
function finish(k,by){
  const m=labels[k]; menuEl.textContent=m;
  whoEl.textContent= by==='나' ? '내가 멈춘 칸' : '회전판이 멈춘 칸 (무작위)';
  const r=R[m]; recEl.innerHTML='';
  if(r){
    const tm=document.createElement('div'); tm.className='time'; tm.textContent='⏱ '+r.t; recEl.appendChild(tm);
    const h1=document.createElement('h3'); h1.textContent='재료'; recEl.appendChild(h1);
    const ul=document.createElement('ul'); r.i.forEach(x=>{const li=document.createElement('li'); li.textContent=x; ul.appendChild(li);}); recEl.appendChild(ul);
    const h2=document.createElement('h3'); h2.textContent='순서'; recEl.appendChild(h2);
    const ol=document.createElement('ol'); r.s.forEach(x=>{const li=document.createElement('li'); li.textContent=x; ol.appendChild(li);}); recEl.appendChild(ol);
  }
  result.hidden=false; hint.innerHTML='오늘은 <em>'+m+'</em>';
}
cv.addEventListener('click',start);
document.getElementById('again').addEventListener('click',()=>{result.hidden=true; window.scrollTo({top:0,behavior:'smooth'}); start();});
document.getElementById('cats').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||state==='spinning'||state==='stopping')return;
  document.querySelectorAll('#cats button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));
  setLabels(b.dataset.cat==='전체'?MIX:SETS[b.dataset.cat]); angle=0; result.hidden=true; state='idle';
  hint.innerHTML='회전판을 <em>탭</em>하면 돕니다'; draw();
});
document.fonts?.ready.then(draw); draw();
</script>
