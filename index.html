<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>무엇이든 정해드림</title>
<meta name="description" content="無를 有로. 못 정한 것을 정한 것으로. 오늘 뭐 먹을지, 뭘 살지, 어디 갈지 정해 드립니다.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
:root{
  --bg:#fbf7ef; --ink:#1d1a16; --muted:#6b645a; --line:#e6ded0;
  --accent:#e8b400; --accent-ink:#1d1a16; --card:#ffffff; --red:#e0453a;
}
@media (prefers-color-scheme: dark){
  :root{ color-scheme:dark; --bg:#17150f; --ink:#f3ede2; --muted:#a79f92; --line:#33302a; --card:#221f19; }
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;padding-inline:16px;padding-block:28px 32px;display:flex;flex-direction:column;align-items:center;gap:22px;box-sizing:border-box}
header{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.brand{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400;font-size:clamp(38px,11vw,60px);line-height:1.05;margin:0;letter-spacing:.5px;text-wrap:balance}
.brand small{display:block;font-size:.5em;color:var(--muted);letter-spacing:.2em;margin-bottom:6px}
.tag{margin:0;font-size:clamp(17px,4.6vw,21px);font-weight:700;color:var(--ink)}
.tag b{color:var(--red)}
.tag2{margin:0;font-size:15px;color:var(--muted)}
.rooms{display:flex;flex-direction:column;gap:12px;width:min(92vw,420px)}
.room{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;text-decoration:none;color:var(--ink)}
.room.live{border-color:var(--accent);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.room .ico{width:56px;height:56px;flex:none;border-radius:50%;display:grid;place-items:center}
.room .t{display:flex;flex-direction:column;gap:2px}
.room .t strong{font-size:20px}
.room .t span{font-size:14px;color:var(--muted)}
.room.soon{opacity:.55}
.room.soon .t strong::after{content:" · 준비 중";font-size:13px;color:var(--muted);font-weight:400}
.yt{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.yt a{font-weight:700;font-size:16px;padding:12px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none}
.yt a.sub{background:var(--red);color:#fff;border-color:var(--red)}
.yt a:focus-visible,.room:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
footer{font-size:13px;color:var(--muted);text-align:center;margin-top:auto}
</style>
</head>
<body>
<header>
  <h1 class="brand"><small>채널</small>무엇이든<br>정해드림</h1>
  <p class="tag"><b>無</b>를 <b>有</b>로. 못 정한 것을 정한 것으로.</p>
  <p class="tag2">오늘 뭐 먹을지, 뭘 살지, 어디 갈지.</p>
</header>

<nav class="rooms" aria-label="방 목록">
  <a class="room live" href="cook/">
    <svg class="ico" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="31" r="16" fill="#e0453a"/><rect x="11" y="19" width="34" height="8" rx="4" fill="#1d1a16"/><rect x="24" y="9" width="8" height="12" rx="3" fill="#8a5a2b"/></svg>
    <span class="t"><strong>오늘 뭐 해 먹지? 집밥 회전판</strong><span>멈춘 요리의 재료·순서·시간까지. 한중일양 · 계란·두부·김치·스팸.</span></span>
  </a>
  <a class="room live" href="wheel/">
    <svg class="ico" viewBox="0 0 56 56" aria-hidden="true">
      <g transform="translate(28 28)">
        <path d="M0 0 L26 0 A26 26 0 0 1 13 22.5 Z" fill="#e0453a"/><path d="M0 0 L13 22.5 A26 26 0 0 1 -13 22.5 Z" fill="#f2c12e"/>
        <path d="M0 0 L-13 22.5 A26 26 0 0 1 -26 0 Z" fill="#5cb85c"/><path d="M0 0 L-26 0 A26 26 0 0 1 -13 -22.5 Z" fill="#2b7fd1"/>
        <path d="M0 0 L-13 -22.5 A26 26 0 0 1 13 -22.5 Z" fill="#6a4fc9"/><path d="M0 0 L13 -22.5 A26 26 0 0 1 26 0 Z" fill="#f28c28"/>
        <circle r="5" fill="#1d1a16"/>
      </g>
    </svg>
    <span class="t"><strong>오늘 뭐 먹지? 회전판</strong><span>탭해서 돌리고, 탭해서 멈춥니다. 안 멈추면 무작위.</span></span>
  </a>
  <span class="room soon" aria-disabled="true">
    <svg class="ico" viewBox="0 0 56 56" aria-hidden="true"><rect x="10" y="14" width="36" height="8" rx="4" fill="#2a9d8f"/><rect x="10" y="26" width="24" height="8" rx="4" fill="#3aa6b9"/><rect x="10" y="38" width="30" height="8" rx="4" fill="#2b7fd1"/></svg>
    <span class="t"><strong>내일 어디 돌릴까 투표</strong><span>한식·중식·일식·양식, 여러분이 정합니다.</span></span>
  </span>
  <span class="room soon" aria-disabled="true">
    <svg class="ico" viewBox="0 0 56 56" aria-hidden="true"><rect x="12" y="18" width="14" height="26" rx="3" fill="#c2409a"/><rect x="30" y="12" width="14" height="32" rx="3" fill="#d95f80"/></svg>
    <span class="t"><strong>뭘 살지 비교표</strong><span>같은 값이면 어느 것. 표 한 장으로 정합니다.</span></span>
  </span>
</nav>

<div class="yt">
  <a href="https://www.youtube.com/channel/UCss72-MAR4751_4vekHP4Hw" target="_blank" rel="noopener">유튜브 채널 보기</a>
  <a class="sub" href="https://www.youtube.com/channel/UCss72-MAR4751_4vekHP4Hw?sub_confirmation=1" target="_blank" rel="noopener">구독하기</a>
</div>

<footer>매일 저녁, 하나씩 정해 드립니다.</footer>
</body>
</html>
