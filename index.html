<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>오늘 뭐 먹지 회전판</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
:root{
  --bg:#fbf7ef; --ink:#1d1a16; --muted:#6b645a; --line:#e6ded0;
  --accent:#e8b400; --accent-ink:#1d1a16; --card:#ffffff;
  --w1:#e0453a;--w2:#f28c28;--w3:#f2c12e;--w4:#5cb85c;--w5:#2a9d8f;--w6:#2b7fd1;
  --w7:#6a4fc9;--w8:#c2409a;--w9:#8a5a2b;--w10:#3aa6b9;--w11:#d95f80;--w12:#7c9a2f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark; --bg:#17150f; --ink:#f3ede2; --muted:#a79f92; --line:#33302a; --card:#221f19; }
}
:root[data-theme="dark"]{ color-scheme:dark; --bg:#17150f; --ink:#f3ede2; --muted:#a79f92; --line:#33302a; --card:#221f19; }
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;padding-inline:16px;padding-block:12px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;box-sizing:border-box}
h1{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400;font-size:clamp(30px,8vw,44px);margin:4px 0 0;letter-spacing:.5px;color:var(--ink);text-wrap:balance}
.cats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.cats button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 16px;font-size:16px;font-family:inherit;font-weight:700;cursor:pointer}
.cats button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cats button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stage{position:relative;width:min(88vw,380px);aspect-ratio:1;max-width:100%}
canvas{width:100%;height:100%;display:block;border-radius:50%;box-shadow:0 10px 30px rgba(0,0,0,.18);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.pin{position:absolute;left:50%;top:-4px;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:34px solid var(--ink);filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.hint{font-size:18px;font-weight:700;text-align:center;margin:0;min-height:1.4em}
.hint em{font-style:normal;color:var(--accent);background:var(--ink);padding:0 6px;border-radius:4px}
.result{display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 20px;width:min(88vw,380px);box-sizing:border-box;text-align:center}
.result .menu{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-size:clamp(34px,10vw,52px);line-height:1.1;color:var(--ink)}
.result .who{font-size:14px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.actions a,.actions button{font-family:inherit;font-weight:700;font-size:16px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;cursor:pointer}
.actions a.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.foot{font-size:13px;color:var(--muted);text-align:center;margin:0}
@media (prefers-reduced-motion: reduce){ canvas{transition:none} }
</style>
</head>
<body>

<h1>오늘 무엇을 먹지?</h1>
<div class="cats" id="cats" role="group" aria-label="분류">
  <button type="button" data-cat="전체" aria-pressed="true">전체</button>
  <button type="button" data-cat="한식" aria-pressed="false">한식</button>
  <button type="button" data-cat="중식" aria-pressed="false">중식</button>
  <button type="button" data-cat="일식" aria-pressed="false">일식</button>
  <button type="button" data-cat="양식" aria-pressed="false">양식</button>
</div>
<div class="stage">
  <div class="pin" aria-hidden="true"></div>
  <canvas id="wheel" width="760" height="760" aria-label="회전판. 탭하면 돌고, 다시 탭하면 멈춥니다."></canvas>
</div>
<p class="hint" id="hint">회전판을 <em>탭</em>하면 돕니다</p>
<div class="result" id="result" hidden>
  <div class="who" id="who"></div>
  <div class="menu" id="menu"></div>
  <div class="actions">
    <a class="go" id="go" href="#" target="_blank" rel="noopener">지도에서 가까운 집 찾기</a>
    <button type="button" id="again">한 번 더</button>
  </div>
</div>
<p class="foot">안 멈추시면 6초 뒤 회전판이 스스로 멈춥니다. 그 결과도 진짜 무작위입니다.</p>

<script>
const SETS={
  한식:["김치찌개","된장찌개","제육볶음","비빔밥","불고기","순두부찌개","냉면","국밥","칼국수","김밥","떡볶이","삼겹살"],
  중식:["짜장면","짬뽕","탕수육","마라탕","볶음밥","마파두부","양장피","깐풍기","우육면","꿔바로우","마라샹궈","딤섬"],
  일식:["초밥","돈가스","라멘","우동","규동","가츠동","오코노미야키","사시미","텐동","가라아게","오므라이스","연어덮밥"],
  양식:["파스타","피자","햄버거","스테이크","리조또","샐러드","샌드위치","오믈렛","치킨","타코","그라탕","수프"]
};
const MIX=["김치찌개","짜장면","초밥","파스타","제육볶음","짬뽕","돈가스","피자","비빔밥","탕수육","라멘","햄버거","냉면","마라탕","우동","스테이크","국밥","볶음밥","규동","샐러드","칼국수","딤섬","연어덮밥","치킨","떡볶이"];
const COLORS=["--w1","--w2","--w3","--w4","--w5","--w6","--w7","--w8","--w9","--w10","--w11","--w12"];
const cv=document.getElementById('wheel'),ctx=cv.getContext('2d');
const hint=document.getElementById('hint'),result=document.getElementById('result'),menuEl=document.getElementById('menu'),whoEl=document.getElementById('who'),go=document.getElementById('go');
let labels=MIX.slice(),angle=0,vel=0,state='idle',autoTimer=null,raf=null,target=null;
let N=labels.length,SEG=Math.PI*2/N;
function setLabels(a){labels=a.slice();N=labels.length;SEG=Math.PI*2/N;}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function draw(){
  const R=cv.width/2,cx=R,cy=R; ctx.clearRect(0,0,cv.width,cv.height);
  for(let i=0;i<N;i++){
    const a0=angle+i*SEG-Math.PI/2-SEG/2,a1=a0+SEG;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R-6,a0,a1);ctx.closePath();
    ctx.fillStyle=css(COLORS[i%((N%12===1)?11:12)]);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=2;ctx.stroke();
    ctx.save();ctx.translate(cx,cy);ctx.rotate(a0+SEG/2);ctx.textAlign='right';ctx.textBaseline='middle';
    ctx.fillStyle='#fff';ctx.font='bold '+(N>16?24:34)+'px "Noto Sans KR",sans-serif';ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=4;
    ctx.fillText(labels[i],R-28,0);ctx.restore();
  }
  ctx.beginPath();ctx.arc(cx,cy,34,0,Math.PI*2);ctx.fillStyle=css('--ink');ctx.fill();
}
function indexAtPin(){ // pin at top; segment i centered at angle+i*SEG-PI/2
  let a=(-angle)%(Math.PI*2); if(a<0)a+=Math.PI*2; return Math.round(a/SEG)%N;
}
function rnd(n){const u=new Uint32Array(1);crypto.getRandomValues(u);return u[0]%n}
function loop(){
  if(state==='spinning'){angle+=vel;}
  else if(state==='stopping'){
    vel*=0.97; angle+=vel;
    if(vel<0.004){ // snap to segment center
      const k=indexAtPin(); const goal=-k*SEG; let d=((goal-angle)%(Math.PI*2)+Math.PI*3)%(Math.PI*2)-Math.PI; angle+=d*0.2;
      if(Math.abs(d)<0.002){angle=goal;state='done';finish(k,target);return draw();}
    }
  }
  draw(); raf=requestAnimationFrame(loop);
}
function start(){
  if(state==='spinning')return stop('나');
  clearTimeout(autoTimer); result.hidden=true; state='spinning'; vel=0.32+rnd(100)/1000; target=null;
  hint.innerHTML='한 번 더 <em>탭</em>하면 멈춥니다';
  autoTimer=setTimeout(()=>{ if(state==='spinning') stop('회전판'); },6000);
  cancelAnimationFrame(raf); loop();
}
function stop(by){
  if(state!=='spinning')return; clearTimeout(autoTimer); target=by;
  if(by==='회전판'){ // true random pick, then decelerate so it lands there
    const k=rnd(N); const goal=-k*SEG; let cur=angle%(Math.PI*2); let dist=((goal-cur)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)+Math.PI*2*2;
    // choose initial vel so that sum of geometric decay ≈ dist: v/(1-r)=dist → v=dist*(1-0.975)
    vel=dist*0.03; state='stopping';
  } else { state='stopping'; }
  hint.textContent='…';
}
function finish(k,by){
  const m=labels[k]; menuEl.textContent=m;
  whoEl.textContent= by==='나' ? '내가 멈춘 칸' : '회전판이 멈춘 칸 (무작위)';
  go.href='https://map.naver.com/p/search/'+encodeURIComponent(m); result.hidden=false;
  hint.innerHTML='오늘 메뉴는 <em>'+m+'</em>';
}
cv.addEventListener('click',start);
document.getElementById('again').addEventListener('click',start);
document.getElementById('cats').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||state==='spinning'||state==='stopping')return;
  document.querySelectorAll('#cats button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));
  setLabels(b.dataset.cat==='전체'?MIX:SETS[b.dataset.cat]); angle=0; result.hidden=true; state='idle';
  hint.innerHTML='회전판을 <em>탭</em>하면 돕니다'; draw();
});
document.fonts?.ready.then(draw); draw();
</script>
</body>
</html>
